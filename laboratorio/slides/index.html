# Sobre


---
.texto[Curso]

A ideia dele é ser um *curso de laboratório*, ou seja, um curso no qual vamos .sketch-highlight[aprender fazendo]


.pull-left[
- Nos dividiremos em grupos de 2 a 3 pessoas
- Cada grupo receberá uma pergunta empírica
- Toda semana, faremos dois seminários, com um grupo apresentando o que fez e outro comentando
]

.pull-right[
Vamos aprender a lidar com problemas reais de pesquisa em diferentes áreas, que irão demandar aporte a diferentes literaturas e técnicas
]

.font90[
.pull-left[
.texto2[Por que trabalhar em grupo?]

Tanto em campanhas eleitorais quanto em empresas de consultoria, institutos de pesquisa, etc., o trabalho em grupo é a regra

Isso permite divisão de tarefas e coordenação de esforços, o que resulta (espero) em análises mais complexas e ambiciosas
]

.pull-right[
.texto2[Por que não usar dados de pesquisas prontas?]

A maioria dos problemas relevantes de pesquisa não estão resolvidos *justamente porque não há dados prontos* 

Aprender a localizar fontes, pensar em estratégias de coleta e manipulação, entre outros, é uma das habilidades que queremos desenvolver no curso
]
]

# Como trabalharemos?




---
.texto[Avaliação]

A nota final será composta por três dimensões:

.pull-c-left[
.texto2[Relatórios (*60pts*)]

Cada grupo produzirá e apresentará .sketch-highlight[3] relatórios de pesquisa, cada um valendo 20 pontos
]

.pull-c-center[
.texto2[Arguições (*30pts*)]

Cada grupo revisará e arguirá .sketch-highlight[3] relatórios de outros grupos, cada um valendo 10 pontos
]

.pull-c-right[
.texto2[Participação (*10pts*)]

.sketch-highlight[Presença], contribuição para as discussões e envolvimento nas apresentações e arguições
]


---
.texto[Como fazer relatórios?]

Na próxima aula, teremos vários exemplos. Por enquanto, algumas dicas:

.font90[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> A organização é simples: resumo com a pergunta, o que foi feito, resultados

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Use gráficos e tabelas para apresentar resultados, não apenas texto

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Vale também usar revisões sistemáticas e apresentar resultados de forma comparativa

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Mobilize literatura e dialogue com ela (e.g., compare seus resultados com os de outros estudos)
]


---
.texto[Entrega dos relatórios]

.pull-left[
Teremos uma pasta no Google Drive com subpastas para cada aula, onde cada grupo deverá enviar os relatórios em PDF e os materiais de replicação (código, dados, etc.) .grifo[até a segunda-feira, 23h59, na semana de cada aula]
]

.pull-right[
.texto2[Materiais de replicação] serão parte do material usado por outros grupos e, por isso, é importante que estejam disponíveis com esse mínimo de antecedência
]


---
.texto[Como revisar relatórios?]

Os grupos responsáveis por comentar os relatórios de outros grupos devem priorizar o seguinte:

.font90[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Preparar uma avaliação crítica do relatório, incluindo metodologia, análise e interpretação dos resultados

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Trazer questões da bibliografia e da literatura para a discussão do grupo reponsável pela apresentação e da turma em geral
]




---
.texto[Literatura]

.pull-left[
.texto2[Não haverá livro-texto]

As leituras combinam artigos, capítulos e materiais aplicados sobre eleições, partidos, comportamento eleitoral, campanhas, comunicação política e opinião pública.
]

.pull-right[
.texto2[A bibliografia é um ponto de partida]

Cada grupo deverá buscar textos adicionais, avaliar sua pertinência e complementar a bibliografia de acordo com a pergunta e o desenho de pesquisa.
]


---

Neste curso, usar .texto2[LLMs] (Large Language Models) é permitido e encorajado, mas...

.pull-left[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Use principalmente para implementar, debuggar, documentar e revisar código, além de apoiar tarefas de análise empírica
]

.pull-right[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#FF6600;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> .grifo-laranja[Não delegue às LLMs o planejamento] da pesquisa, a escolha de métodos ou a interpretação substantiva dos resultados
]

.alert[Todo trabalho deverá conter uma nota informando quais ferramentas foram usadas e em quais tarefas ou partes do trabalho]



---

.texto[Apoio]

Em aulas, especialmente antes e depois dos seminários, poderemos ter momentos de apoio para grupos que precisarem de ajuda com:

.font90[
- Dicas de fontes de dados e estratégias de coleta
- Indicações de pacotes, funções e técnicas de análise
- Sugestões de visualização e apresentação de resultados em `R`
]

.pull-left[

---
.texto[Bloco 1 | Eleições e sistema partidário]

.pull-left[
.texto2[O que estudaremos?]

- Fragmentação, evolução do número de partidos e nacionalização do sistema partidário
- Padrões de competição, coligações e federações
- Diferenças entre eleições para cargos executivos e legislativos
]

.pull-right[
.texto2[O que vamos investigar?]

Como regras eleitorais, coordenação e características regionais estruturam a oferta de candidaturas e os resultados das eleições?
]

.footnote[.font85[Leituras: Guarnieri (2015), “Voto estratégico e coordenação eleitoral”; Zucco &amp; Power (2021), “Fragmentation without cleavages?”.]]


---
.texto[Bloco 2 | Identificação partidária e comportamento eleitoral]

.pull-left[
.texto2[O que estudaremos?]

- Identificação partidária e antipartidária no Brasil
- Efeitos dessas identidades sobre a decisão de voto e a avaliação de governo
- Polarização ideológica e afetiva
]

.pull-right[
.texto2[O que vamos investigar?]

Como eleitores formam percepções sobre partidos e candidatos? Em que medida identidades partidárias organizam o voto, as avaliações políticas e a rejeição aos adversários?
]

.footnote[.font85[Leituras: Green, Palmquist &amp; Schickler (2002), “Partisan Hearts and Minds”; Samuels &amp; Zucco (2018), “Partisans, anti-partisans, and voter behavior”.]]


---
.texto[Bloco 3 | Participação eleitoral]

.pull-left[
.texto2[O que estudaremos?]

- Evolução do comparecimento eleitoral
- Desigualdades territoriais e sociodemográficas no comparecimento, nos votos brancos e nulos
- Efeitos desses comportamentos sobre resultados presidenciais
]

.pull-right[
.texto2[O que vamos investigar?]

Quem participa das eleições, quem deixa de participar e por quê? Como regras, recursos, interesse por política e condições sociais produzem desigualdades na participação?
]

.footnote[.font85[Leituras: Blais (2006), “What affects voter turnout?”; Speck &amp; Peixoto (2022), “Participação eleitoral nas disputas nacionais, estaduais e municipais no Brasil”.]]


---
.texto[Bloco 4 | Campanhas e comunicação política]

.pull-left[
.texto2[O que estudaremos?]

- Propaganda eleitoral, enquadramento e comunicação política
- Gastos de campanha e estratégias de mobilização
- Debates, redes sociais e efeitos das campanhas sobre o comportamento eleitoral
]

.pull-right[
.texto2[O que vamos investigar?]

Como campanhas tentam persuadir, mobilizar e definir os termos da disputa? Quais mensagens alcançam quais públicos e em que condições a comunicação altera percepções e escolhas?
]

.footnote[.font85[Leituras: Chong &amp; Druckman (2007), “Framing theory”; Jacobson (2015), “How do campaigns matter?”.]]


---
.texto[Bloco 5 | Economia, avaliação de governo e voto retrospectivo]

.pull-left[
.texto2[O que estudaremos?]

- Desempenho governamental e incumbência
- Avaliações sociotrópicas e egotrópicas de governo
- Contexto econômico e responsabilização eleitoral
]

.pull-right[
.texto2[O que vamos investigar?]

Em que medida eleitores responsabilizam governos por suas condições de vida e pelo desempenho da economia? Como incumbência e resultados de políticas públicas afetam as eleições?
]

.footnote[.font85[Leituras: Campello (2018), “Retrospective voting and democratic accountability”; Healy &amp; Malhotra (2013), “Retrospective voting reconsidered”.]]

Para o curso funcionar, seguiremos duas regras para a formação de grupos e a escolha de perguntas:

.pull-left[
.texto2[Grupos]

Duplas podem ser formadas livremente; grupos serão sorteados entre demais alunas e alunos (podemos mudar a composição dos grupos ao longo do curso)

.font80[

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> A segunda parte será depois das eleições, e todos os relatórios deverão analisar empiricamente o pleito de 2026, com base em dados oficiais, dados derivados das campanhas e de pesquisas de opinião pública
