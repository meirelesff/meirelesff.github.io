# Eleições e sistema partidário


---
.texto[Como sistemas eleitorais estruturam a competição?]

.font90[
- .texto2[Lei de Duverger:] regras eleitorais têm efeitos mecânicos sobre a conversão de votos em cadeiras e efeitos psicológicos sobre o eleitorado, partidos, etc.

- .texto2[Mensuração:] contar partidos depende da dimensão de relevância; índices diferentes pra fragmentação, concentração, volatilidade, inflação, etc.

- .texto2[Instituições e clivagens:] a tese clássica é a de que diversidade social incentiva a formação de partidos políticos de determinadas famílias ideológicas e organizacionais

- .texto2[Fragmentação endógena:] recursos organizacionais e incentivos às elites também podem produzir novos partidos, mesmo sem novas clivagens sociais
]

.footnote[.font85[Riker (1982); Molinar (1991); Stoll (2008); Zucco &amp; Power (2021).]]


---
.texto[Uma teoria que acumula revisões]

.font90[
&gt; To investigate whether propositions about evanescent institutions can be scientifically falsified and reformulated, I examine in this essay the history of the recent and not wholly accepted revisions of the propositions collectively called Duverger's law: that .grifo[the plurality rule for selecting the winner of elections favors the two-party system]. The body of the essay presents the discovery, revision, testing, and reformulation of sentences in this series in order to demonstrate that in at least one instance in political science, knowledge has been accumulated and a history exists.
]

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> William H. Riker (1982, p. 753)

# Identificação partidária e comportamento eleitoral


---
.texto[Como identidades partidárias organizam o voto?]

.font90[
- .texto2[Modelo de Michigan:] identificação partidária é um vínculo duradouro, que organiza atitudes e opiniões sobre política, governos e eleições

- .texto2[Motivated reasoning:] lealdades partidárias afetam como eleitores percebem os mesmos fatos

- .texto2[Retroalimentação:] identidades moldam percepções, que reforçam atitudes, avaliações de governo e escolhas eleitorais

- .texto2[Running tally:] modelo alternativo entende o partidarismo como um estoque atualizado por avaliações retrospectivas de desempenho
]

.footnote[.font85[Campbell et al. (1960); Fiorina (1981); Bartels (2002).]]


---
.texto[Partidarismo como *perceptual lens*]

.font90[
&gt; In contrast to the notion of partisanship as a simple “running tally” of political assessments, I show that .grifo[party identification is a pervasive dynamic force shaping citizens’ perceptions of, and reactions to, the political world]. My analysis employs panel data to isolate the impact of partisan bias in the context of a Bayesian model of opinion change.
]

# Participação eleitoral


---
.texto[O que mobiliza o eleitorado?]

.font90[
- .texto2[Decisão individual:] benefícios, custos, informação, interesse, recursos e dever cívico

- .texto2[Mobilização:] partidos, campanhas e organizações reduzem custos e aumentam a percepção de que participar importa

- .texto2[Instituições:] voto obrigatório, regras eleitorais, competitividade e estrutura partidária alteram incentivos ao comparecimento

- .texto2[Problema de ligação:] associações comparadas nem sempre são robustas
]

.footnote[.font85[Powell (1986); Jackman (1987); Blais (2006).]]


---
.texto[Uma agenda menos resolvida do que parece]

.font90[
&gt; The dominant view in the literature is that the existing research on voter turnout has established some robust patterns, that we know relatively well why turnout is higher in some countries than in others, and that the main factors that affect variations in turnout are institutional variables. .grifo[My verdict is different]. Many of the findings in the comparative cross-national research are not robust, and when they are, we do not have a compelling microfoundation account of the relationship.
]

# Campanhas e comunicação política


---
.texto[Como mensagens de campanha podem alterar escolhas?]

.font90[
- .texto2[Persuasão:] novas informações mudam crenças ou avaliações sobre candidaturas, partidos e políticas

- .texto2[Priming:] a comunicação altera quais critérios estão acessíveis e recebem maior peso em uma avaliação

- .texto2[Enquadramento:] mensagens selecionam aspectos de um problema e orientam como o público o interpreta

- .texto2[Condições dos efeitos:] força e competição dos enquadramentos, predisposições, conhecimento, fonte e contexto condicionam impacto
]

.footnote[.font85[Chong &amp; Druckman (2007); Jacobson (2015).]]


---
.texto[Enquadramentos conectam comunicação e opinião]

.font90[
&gt; We review the meaning of the concept of framing, approaches to studying framing, and the effects of framing on public opinion. After defining framing and framing effects, we articulate a method for identifying frames in communication and .grifo[a psychological model for understanding how such frames affect public opinion]. We also discuss the relationship between framing and priming, outline future research directions, and describe the normative implications of framing.
]

# Economia, avaliação de governo e voto retrospectivo


---
.texto[Economia dá voto?]

.font90[
- .texto2[Voto retrospectivo:] eleitores usam resultados observados da economia para premiar ou punir governos

- .texto2[Voto econômico:] avaliações podem ser sociotrópicas (ou seja, sobre a economia como um todo) ou egotrópicas (ou seja, sobre a situação econômica pessoal do eleitor)

- .texto2[Competência e vieses:] uma linha influence foca em eventos irrelevantes ou fora do controle do governo pra defender que *accountability* é limitada e, o eleitorado, miópico

- .texto2[Economias abertas:] no Brasil, condições financeiras externas limitam escolhas governamentais e complicam a conexão entre desempenho, voto e accountability
]

.footnote[.font85[Healy &amp; Malhotra (2013); Campello (2018).]]


---
.texto[Accountability é uma possibilidade, não uma garantia]

.font90[
&gt; Understanding the circumstances under which retrospective voting .grifo[achieves effective democratic accountability] and when it fails to do so is an important task for subsequent research.
]

<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#6272A4;overflow:visible;position:relative;"><path d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM241 377c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l87-87-87-87c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L345 239c9.4 9.4 9.4 24.6 0 33.9L241 377z"/></svg> Andrew Healy &amp; Neil Malhotra (2013, abstract)

.alert[O núcleo da agenda é identificar quando avaliações de desempenho disciplinam governos e quando atribuições, informação e vieses rompem essa ligação]
